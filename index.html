<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Welding King | Hialeah, FL</title>
    <style>
        /* Basic CSS Reset & Variables */
        :root {
            --bg-dark: #121212;
            --gold: #FFD700;
            --wa-green: #25D366;
            --text-light: #F3F4F6;
        }
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            text-align: center;
        }
        header {
            padding: 20px;
            background-color: #000;
            border-bottom: 2px solid var(--gold);
        }
        .hero {
            padding: 80px 20px;
        }
        .hero h1 {
            color: var(--gold);
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .btn-whatsapp {
            display: inline-block;
            background-color: var(--wa-green);
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }
        .section {
            padding: 50px 20px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <!-- Drop the transparent logo you made here -->
        <img src="logo-transparent.png" alt="Metal Welding King Logo" width="200">
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Metal Welding King</h1>
        <h2>El Rey del Hierro</h2>
        <p>Premium custom metalwork and welding in Hialeah, FL.</p>
        <!-- The wa.me link directly opens a chat with his number -->
        <a href="https://wa.me/17864882569" class="btn-whatsapp" target="_blank">Chat on WhatsApp</a>
    </section>

    <!-- SERVICES -->
    <section class="section" id="services">
        <h2 style="color: var(--gold);">Our Services</h2>
        <p>Custom Fences • Gates • Structural Welding • Repairs</p>
    </section>

    <!-- FOOTER / CONTACT -->
    <footer style="background: #000; padding: 40px 20px; border-top: 2px solid var(--gold);">
        <h3>Elías Fernández</h3>
        <p>2617 W 76 st 33016. Hialeah, FL.</p>
        <p>Call or Text: (786) 488-2569</p>
    </footer>

</body>
</html>
